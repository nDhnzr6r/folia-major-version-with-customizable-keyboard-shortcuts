name: Release

# 打 tag 即出包：构建 Windows 安装包并发布到本仓库的 Releases，
# 同时生成 latest.yml 供应用内自动更新使用。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Build and publish Windows
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Cache wallpaper-helper Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/windows/wallpaper-helper

      - name: Build wallpaper helper
        run: node packaging/windows/build-wallpaper-helper.mjs

      - name: Build web app for Electron
        env:
          ELECTRON: 'true'
        run: npm run build

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --publish always --config.publish.channel=latest
