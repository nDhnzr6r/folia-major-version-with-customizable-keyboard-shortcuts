name: Release

# 打 tag（v*）发布：Windows、macOS、Linux 一起打包，产物发到本仓库 Releases。
# 手动触发只打包、不发布，产物留在 Actions 的 artifact 里。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: 打包 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      # MNN 源码里有超过 260 字符的目录，Windows 运行器默认会 checkout 失败。
      - name: 允许 Git 长路径
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: 安装 Rust
        if: runner.os == 'Linux' || runner.os == 'Windows'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: 缓存 windowtolayer 的编译结果
        if: runner.os == 'Linux'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .windowtolayer-src

      - name: 缓存壁纸助手的编译结果
        if: runner.os == 'Windows'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packaging/windows/wallpaper-helper

      - name: 编译壁纸助手（Windows）
        if: runner.os == 'Windows'
        run: node packaging/windows/build-wallpaper-helper.mjs

      - name: 编译 windowtolayer（Linux）
        if: runner.os == 'Linux'
        run: node packaging/linux/build-windowtolayer.mjs

      # 打包前 beforePack 会下载 ffmpeg、编译 MNN、下载模型，这几份缓存跨次构建复用。
      - name: 缓存 ffmpeg、MNN 与模型
        uses: actions/cache@v4
        with:
          path: |
            build/mnn
            build/ffmpeg
            models
            ~/AppData/Local/electron-builder/Cache
            ~/Library/Caches/electron-builder
            ~/.cache/electron-builder
          key: folias-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'build/buildMnnRuntime.mjs', 'build/fetchModels.mjs', 'shared/modelManifest.json') }}

      - name: 类型检查
        run: npm run typecheck

      - name: 构建前端
        env:
          ELECTRON: 'true'
        run: npm run build

      - name: 打包
        run: npx electron-builder --publish never --config.publish.channel=latest

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: folias-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.deb
            release/*.rpm
            release/*.tar.gz
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: 发布到 Releases
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载安装包
        uses: actions/download-artifact@v4
        with:
          path: folias-artifacts

      - name: 写入发布说明
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version="${VERSION#v}"
          {
            echo "## Folias ${version}"
            echo ""
            echo "自定义快捷键现在可以设五条，修饰键和按键都由你按下整段组合键决定；全局快捷键也能录 Alt+Space、Shift+Alt+Space 这类组合，Windows 的窗口菜单不会再弹出来。"
            echo ""
            echo "- 应用内的自定义快捷键：五条，任意修饰键组合（至少一个）加字母、数字、F1–F24、空格、方向键、退格、删除等按键，每条绑一个命令；旧版 Alt+字母 的绑定会自动搬进第一条。"
            echo "- 录制组合键时不再被窗口菜单打断：Alt+Space 的空格按下由系统菜单接管，现在菜单被拦下，松开时补录。"
            echo "- 全局快捷键与之前一样：五条，任意修饰键组合，旧绑定自动补回 Ctrl+Alt+Shift。"
            echo ""
            echo "安装包：Windows（NSIS 安装程序）、macOS（dmg / zip，未签名）、Linux（deb / rpm / tar.gz）。"
          } > release-notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          mapfile -d '' files < <(find folias-artifacts -type f -print0)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "Folias ${TAG#v}" --notes-file release-notes.md
          else
            gh release create "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --title "Folias ${TAG#v}" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi
